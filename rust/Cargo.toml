[package]
name = "ai_keyboard_core"
version = "0.1.0"
edition = "2021"
description = "Gemini Live streaming transcription core for the AI Keyboard Android IME"

[lib]
name = "ai_keyboard_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
